# Frozen for v1. The Ralph loop may NOT add entries here (CLAUDE.md hard limit).
# Everything the v1 backlog (T01-T21) needs is already listed.

[versions]
agp                    = "8.13.2"
kotlin                 = "2.3.21"
ksp                    = "2.3.11"
compileSdk             = "36"
minSdk                 = "26"
targetSdk              = "36"

composeBom             = "2026.06.01"
coreKtx                = "1.18.0"
activityCompose        = "1.13.0"
lifecycle              = "2.10.0"
navigationCompose      = "2.9.8"
exifinterface          = "1.4.2"

coroutines             = "1.11.0"
serialization          = "1.11.0"
hilt                   = "2.58"
hiltNavigationCompose  = "1.3.0"
room                   = "2.8.4"
coil                   = "3.4.0"

junit4                 = "4.13.2"
junitBom               = "5.14.4"
androidJunit5          = "2.0.1"
turbine                = "1.2.1"
robolectric            = "4.16.1"
robolectricAndroidAll  = "16-robolectric-13921718-i7"
roborazzi              = "1.73.0"
androidxTestCore       = "1.7.0"
androidxTestExtJunit   = "1.3.0"
detekt                 = "1.23.8"
benchmark              = "1.4.1"

[libraries]
# --- Compose (versions come from the BOM) ---
compose-bom                   = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui                    = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics           = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling            = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview    = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4        = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest      = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-foundation            = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3             = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- AndroidX ---
androidx-core-ktx             = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose     = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose   = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-exifinterface        = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# --- Kotlin ---
kotlinx-coroutines-core       = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test       = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json    = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# --- DI ---
hilt-android                  = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler                 = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-android-testing          = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Persistence ---
room-runtime                  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx                      = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler                 = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing                  = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# --- Images (Browse thumbnails only, per ARCHITECTURE 2) ---
coil-compose                  = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp           = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# --- Test ---
junit-bom                     = { group = "org.junit", name = "junit-bom", version.ref = "junitBom" }
junit-jupiter-api             = { group = "org.junit.jupiter", name = "junit-jupiter-api" }
junit-jupiter-params          = { group = "org.junit.jupiter", name = "junit-jupiter-params" }
junit-jupiter-engine          = { group = "org.junit.jupiter", name = "junit-jupiter-engine" }
junit-vintage-engine          = { group = "org.junit.vintage", name = "junit-vintage-engine" }
junit-platform-launcher       = { group = "org.junit.platform", name = "junit-platform-launcher" }
junit4                        = { group = "junit", name = "junit", version.ref = "junit4" }
turbine                       = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
robolectric                   = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Pinned so Robolectric never downloads at test runtime; check.sh runs --offline.
robolectric-android-all       = { group = "org.robolectric", name = "android-all-instrumented", version.ref = "robolectricAndroidAll" }
roborazzi                     = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose             = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule          = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-test-core-ktx        = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit       = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

# --- Benchmark (scripts/bench.sh only; module created by T10) ---
benchmark-macro-junit4        = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }

# --- build-logic convention plugin classpath ---
android-gradlePlugin          = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin           = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin           = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library", version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                 = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
roborazzi            = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt               = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
android-junit5       = { id = "de.mannodermaus.android-junit5", version.ref = "androidJunit5" }

# Convention plugins defined in build-logic/
diffuse-android-application = { id = "diffuse.android.application" }
diffuse-android-library     = { id = "diffuse.android.library" }
diffuse-jvm-library         = { id = "diffuse.jvm.library" }
diffuse-compose             = { id = "diffuse.compose" }
diffuse-hilt                = { id = "diffuse.hilt" }
